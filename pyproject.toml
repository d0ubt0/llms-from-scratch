[project]
name = "llms-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sepabonn", email = "sepabonn@unal.edu.co" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "safetensors>=0.8.0",
    "tiktoken>=0.14.0",
    "torch",
    "torchvision",
]

[project.scripts]
llms-from-scratch = "llms_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
