[project]
name = "llms-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sepabonn", email = "sepabonn@unal.edu.co" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "tiktoken>=0.14.0",
    "torch",
    "torchvision",
]

[project.scripts]
llms-from-scratch = "llms_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
